{% extends "formularios_base.html" %}

{% block title %}Editar Paciente{% endblock %}

{% block content %}
            <h1>Editar paciente</h1>


            <div class="form-box">
                <form method="POST" action="{{ url_for('pacientes.pacientes_editar', paciente_id=paciente.idpaciente) }}">
                    <label for="nombrecompleto">Nombre completo:</label>
                    <input type="text" name="nombrecompleto" value="{{ paciente.nombrecompleto }}" class="form-control">
                    {% if errores.nombrecompleto %}
                    <small class="text-danger" style="color: red;">{{ errores.nombre }}</small>
                    {% endif %}


                    <label for="fechanacimiento">Fecha de nacimiento:</label>
                    <input type="date" name="fechanacimiento" value="{{ paciente.fechanacimiento }}"
                        class="form-control">
                    {% if errores.fechanacimiento %}
                    <small class="text-danger" style="color: red;">{{ errores.fechanacimiento }}</small>
                    {% endif %}


                    <label for="enfermedadescronicas">Enfermedades crónicas:</label>
                    <input type="text" id="enfermedadescronicas" name="enfermedadescronicas"
                        value="{{ paciente.enfermedadescronicas if paciente.enfermedadescronicas else '' }}"
                        placeholder="(Opcional)">

                    <label for="alergias">Alergias:</label>
                    <input type="text" id="alergias" name="alergias"
                        value="{{ paciente.alergias if paciente.alergias else '' }}" placeholder="(Opcional)">

                    <label for="antecedentesfam">Antecedentes familiares:</label>
                    <input type="text" id="antecedentesfam" name="antecedentesfam"
                        value="{{ paciente.antecedentesfam if paciente.antecedentesfam else '' }}"
                        placeholder="(Opcional)">

                    <div class="form-buttons">
                        <button type="submit" class="guardar">Guardar cambios</button>
                        <a href="{{ url_for('pacientes.pacientes') }}" class="cancelar">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
